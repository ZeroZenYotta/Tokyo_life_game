<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#241d39">
<title>东京人生：心动与野心</title>
<style>
:root{--bg:#f6f2fb;--ink:#2d2540;--muted:#7b718d;--purple:#7964bd;--pink:#e78ba9;--line:#e8e0f2;--card:#fff;--green:#4c987b;--gold:#c8943b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#f9f4ff,#f8edf4 60%,#edf3ff);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:0 auto;padding:16px 14px 32px}.hero{position:relative;overflow:hidden;border-radius:24px;padding:25px 22px;color:#fff;background:linear-gradient(135deg,#31294f,#66528e 58%,#d58cae);box-shadow:0 12px 34px #45335d22}
.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-65px;top:-75px;background:#ffffff12;border:1px solid #ffffff24}.eyebrow{font-size:11px;letter-spacing:2px;opacity:.8}.hero h1{font-size:27px;line-height:1.2;margin:8px 0}.hero p{font-size:13px;opacity:.9;line-height:1.7;margin:8px 0 0;max-width:440px}.tag{display:inline-block;margin-top:15px;padding:6px 10px;border:1px solid #ffffff50;border-radius:99px;font-size:11px}
.panel{background:#ffffffdc;border:1px solid #fff;border-radius:19px;padding:16px;margin-top:13px;box-shadow:0 5px 20px #39274c0a}.section-title{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:12px}.section-title small{font-weight:500;color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f7f3fc;border-radius:12px;padding:10px 8px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat strong{display:block;margin-top:4px;font-size:17px}.stat em{font-style:normal;font-size:10px;color:var(--muted)}
.profile{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:linear-gradient(145deg,#f7d6e5,#e5dfff);border:1px solid #fff}.profile h2{font-size:17px;margin:0 0 4px}.profile p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:10px;padding:4px 8px;border-radius:99px;background:#f0eafa;color:#69569a}
.story{background:linear-gradient(140deg,#fff,#fcf6fb);border-radius:15px;border:1px solid var(--line);padding:15px;line-height:1.8;font-size:14px}.story .day{color:var(--purple);font-weight:800;font-size:11px;letter-spacing:1px}.story h3{font-size:18px;line-height:1.4;margin:7px 0}.story p{margin:8px 0;color:#514761}.choices{display:grid;gap:8px;margin-top:12px}.choice{background:#fff;border:1px solid #e5d9f3;border-radius:13px;padding:12px;text-align:left;color:var(--ink);line-height:1.5;transition:.15s}.choice:hover{border-color:var(--purple);background:#faf7ff}.choice b{display:block;font-size:13px}.choice span{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.action{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-align:left;min-height:83px}.action .ico{font-size:21px}.action b{display:block;font-size:13px;margin:5px 0 2px}.action small{font-size:10px;color:var(--muted);line-height:1.4}.action:disabled{opacity:.4;cursor:not-allowed}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.person{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.person-top{display:flex;gap:9px;align-items:center}.miniavatar{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:23px;background:linear-gradient(140deg,#f5dbe6,#e5e0ff);flex:0 0 43px}.person h3{margin:0;font-size:13px}.person small{font-size:10px;color:var(--muted)}.bar{height:6px;background:#eee8f5;border-radius:9px;overflow:hidden;margin:9px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ba83d9,#ed91b2);border-radius:9px}.person-foot{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.person button{width:100%;margin-top:9px;padding:8px;border-radius:9px;background:#f4effb;color:#66528e;font-size:11px;font-weight:700}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary{padding:11px 14px;border-radius:12px;font-size:12px;font-weight:750}.primary{background:linear-gradient(120deg,#8069bd,#a77fc7);color:white}.secondary{background:#f1ecf8;color:#655583}.footer{text-align:center;color:#9b90a8;font-size:10px;padding:22px 8px}.hidden{display:none!important}.log{font-size:12px;line-height:1.65;color:#655b74;border-bottom:1px solid #f0eaf5;padding:8px 0}.log:last-child{border-bottom:0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#302743;color:white;padding:10px 15px;border-radius:99px;font-size:12px;box-shadow:0 5px 22px #0002;z-index:5;max-width:90vw;text-align:center}.modal{position:fixed;inset:0;background:#21172f9c;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modalbox{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 60px #0003}.modalbox h2{margin:0 0 8px;font-size:22px}.modalbox p{font-size:13px;color:#6c627a;line-height:1.7}.field{display:block;width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 12px;background:#fcfaff;color:var(--ink)}@media(min-width:620px){.grid2{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h1{font-size:32px}.app{padding-top:24px}.people{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">A LIFE SIMULATION · VISUAL NOVEL</div>
    <h1>东京人生：<br>心动与野心</h1>
    <p>人生没有唯一剧本。随机的起点、真实的选择，以及那些可能改变未来的人。</p>
    <span class="tag">随机人生 · 多角色攻略 · 多结局</span>
  </header>
  <section id="welcome" class="panel">
    <div class="section-title">开启新的人生 <small>每次开局都会变化</small></div>
    <p style="font-size:13px;line-height:1.8;color:#6d627b">你将来到东京，面对留学、职场、友情、创业与恋爱。每个选择都会影响你的能力、人际关系和未来。</p>
    <label style="font-size:12px;font-weight:700">为主角取个名字</label>
    <input id="nameInput" class="field" maxlength="12" placeholder="例如：小夏">
    <div class="btnrow"><button class="primary" id="startBtn">随机生成我的人生 →</button><button class="secondary" id="continueBtn">继续上次人生</button></div>
    <p style="font-size:10px;color:#9a90a5;margin-bottom:0">第一版为手机网页原型；进度保存在当前浏览器中。</p>
  </section>
  <main id="game" class="hidden">
    <section class="panel">
      <div class="profile"><div class="avatar" id="mainAvatar">🌸</div><div style="flex:1"><h2 id="playerName">小夏</h2><p id="bio"></p><div class="chips" id="traits"></div></div></div>
      <div style="height:13px"></div><div class="stats" id="stats"></div>
    </section>
    <section class="panel">
      <div class="section-title">人生进程 <small id="phase"></small></div>
      <div class="story" id="story"></div>
      <div class="choices" id="choices"></div>
    </section>
    <section class="panel">
      <div class="section-title">今天做些什么 <small>行动会消耗精力与时间</small></div>
      <div class="grid2" id="actions"></div>
    </section>
    <section class="panel">
      <div class="section-title">命运中的人 <small>每个人都有自己的故事</small></div>
      <div class="people" id="people"></div>
    </section>
    <section class="panel">
      <div class="section-title">人生记录 <small>最近发生的事</small></div>
      <div id="logs"></div>
      <div class="btnrow" style="margin-top:12px"><button class="secondary" id="saveBtn">保存进度</button><button class="secondary" id="newLifeBtn">开启新人生</button><button class="secondary" id="endBtn">查看人生总结</button></div>
    </section>
  </main>
  <div class="footer">原型版本 0.1 · 后续可扩展剧情、插画、配音与微信小游戏适配</div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const characters=[
 {id:"senpai",name:"神谷 凌",role:"事业型前辈",emoji:"🖤",traits:["理性","可靠","慢热"],intro:"在一家科技公司工作的前辈，习惯把关心藏在严格的建议里。",likes:["学习","工作","认真"],route:"事业与信任",lines:["你比自己想象中更有潜力。别急着证明给所有人看。","如果你愿意，我可以陪你把计划再梳理一遍。","努力当然重要，但别忘了给自己留一点生活。"]},
 {id:"haru",name:"藤原 晴",role:"温柔学长",emoji:"🌤️",traits:["温柔","细心","善于倾听"],intro:"总会记得你随口说过的小事，擅长让忙碌的日子慢下来。",likes:["休息","社交","善意"],route:"日常与陪伴",lines:["今天看起来很累。要不要先去吃点好吃的？","你不必每件事都做得完美，在我这里也是。","下次有烦恼的话，也可以第一个告诉我。"]},
 {id:"ren",name:"陆 莲",role:"创业伙伴",emoji:"🔥",traits:["大胆","行动派","有野心"],intro:"脑子里总有新点子，正在寻找能一起把想法变成现实的人。",likes:["创业","工作","冒险"],route:"梦想与并肩",lines:["想法很棒！我们先做个小版本，边做边改。","我喜欢你认真讨论事情的样子，很有感染力。","失败不丢脸，什么都不试才可惜。"]},
 {id:"mio",name:"白石 澪",role:"神秘同伴",emoji:"🌙",traits:["独立","敏锐","难以捉摸"],intro:"总在关键时刻出现，似乎知道一些关于这座城市的秘密。",likes:["探索","社交","独立"],route:"秘密与自我",lines:["你有没有想过，人生并不一定要按别人期待的路线走？","我很少对人产生兴趣……但你有点特别。","等你准备好了，我会告诉你我一直隐瞒的事。"]}
];
const eventPool=[
 {title:"便利店的深夜相遇",text:"加班后的便利店里，你发现一位熟悉的人也在挑选热饮。对方看起来有些疲惫。",choices:[["主动打招呼，聊聊今天","social",2,"haru",7],["请对方喝一杯热饮","money",-300,"haru",10],["点头微笑后先回去休息","energy",10,"mio",2]]},
 {title:"意外的实习机会",text:"学校的公告栏贴出一则实习招募。工作内容很有挑战，但申请时间只剩两天。",choices:[["立刻准备申请材料","study",3,"senpai",5],["找前辈请教面试经验","social",2,"senpai",9],["先评估时间和经济压力","money",200,null,0]]},
 {title:"创业点子的碰撞",text:"朋友提出一个看起来很大胆的创业点子。你们越聊越兴奋，但风险也不小。",choices:[["一起做市场调查","skill",3,"ren",8],["先做最小可行产品","skill",2,"ren",10],["暂时不投入资金","money",500,"ren",2]]},
 {title:"周末的邀请",text:"忙碌的一周终于结束，有人发来消息，问你要不要一起去逛街或看展。",choices:[["欣然赴约，给生活一点空间","energy",12,"haru",8],["邀请更多朋友一起去","social",3,"mio",5],["留在家里规划下周目标","study",2,"senpai",4]]},
 {title:"一封陌生邮件",text:"你收到一封没有署名的邮件，内容提到一份机会，也提到你最近遇到的人。",choices:[["认真调查邮件来源","skill",3,"mio",8],["把邮件告诉信任的朋友","social",2,"haru",5],["暂时搁置，专注眼前的事","study",2,null,0]]},
 {title:"重要的面试",text:"面试官问你：当团队意见不一致时，你会怎么做？你知道这个回答可能改变机会。",choices:[["强调沟通与共同目标","social",3,"senpai",8],["坦诚说出自己的判断","skill",2,"ren",6],["承认自己仍在学习","study",2,"haru",5]]},
 {title:"雨天的屋檐下",text:"突然下起大雨，你和某个人被困在同一个屋檐下。雨声让沉默也变得自然。",choices:[["聊聊各自真正想要的人生","social",2,"mio",10],["分享一个只有朋友知道的秘密","social",1,"haru",8],["提议雨停后一起吃饭","money",-200,"ren",6]]}
];
const rand=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
let S=null;
function newGame(name){
 const bg=rand([{name:"普通工薪家庭",money:3500,bonus:{study:2},desc:"从普通的起点开始，靠自己积累机会。"},{name:"支持你的家庭",money:6500,bonus:{social:2},desc:"你拥有一些支持，也希望走出自己的道路。"},{name:"独立打拼",money:1800,bonus:{skill:3},desc:"你很早就学会独立，资源有限但韧性十足。"},{name:"曾经的优等生",money:4200,bonus:{study:4},desc:"过去的努力给你打下基础，未来仍要自己选择。"}]);
 const trait=rand(["行动派","观察入微","温柔共情","理性规划","自由灵魂","不服输"]);
 S={name:name||rand(["小夏","千寻","美月","小林","星野"]),age:rand([18,19,20,21,22]),month:4,turn:1,money:bg.money,energy:rand([65,75,85]),study:rand([15,25,35]),skill:rand([15,25,35]),social:rand([15,25,35]),health:80,background:bg.name,desc:bg.desc,trait,bonus:bg.bonus,relations:{senpai:rand([0,5,10]),haru:rand([0,5,10]),ren:rand([0,5,10]),mio:rand([0,5,10])},met:{},ending:null,logs:[],eventCount:0,usedEvents:[],lastAction:"",lifeSeed:Math.floor(Math.random()*999999)};
 Object.keys(S.bonus).forEach(k=>S[k]=clamp(S[k]+S.bonus[k]));
 S.logs.unshift(`人生开始：${S.background}。你的性格倾向是「${S.trait}」。`);
 S.logs.unshift(`你在${S.age}岁时来到东京，新的故事开始了。`);
 document.getElementById("welcome").classList.add("hidden");document.getElementById("game").classList.remove("hidden");render();save(false);
}
function phaseName(){if(S.age<20)return "适应与探索";if(S.age<23)return "成长与选择";if(S.age<27)return "事业与关系";return "人生新篇章"}
function log(t){S.logs.unshift(t);S.logs=S.logs.slice(0,8)}
function stats(){
 const data=[["💴","资金",S.money,"円"],["⚡","精力",S.energy,"/100"],["📚","学识",S.study,"/100"],["💻","技能",S.skill,"/100"],["💬","社交",S.social,"/100"],["🌿","健康",S.health,"/100"],["🎂","年龄",S.age,"岁"],["🗓️","月份",S.month,"月"]];
 document.getElementById("stats").innerHTML=data.slice(0,4).map(x=>`<div class="stat"><span>${x[0]} ${x[1]}</span><strong>${x[2]}</strong><em>${x[3]}</em></div>`).join("");
 document.getElementById("bio").textContent=`${S.age}岁 · ${S.background} · ${S.desc}`;
 document.getElementById("traits").innerHTML=`<span class="chip">${S.trait}</span><span class="chip">${phaseName()}</span><span class="chip">第${S.turn}回合</span>`;
}
function render(){
 if(!S)return;
 document.getElementById("playerName").textContent=S.name;
 stats();
 document.getElementById("phase").textContent=`${S.age}岁 · ${S.month}月 · 第${S.turn}回合`;
 if(S.ending){document.getElementById("story").innerHTML=`<div class="day">人生阶段总结</div><h3>${S.ending}</h3><p>这不是唯一可能的人生。你可以回顾记录，或者开启一段全新的旅程。</p>`;document.getElementById("choices").innerHTML=`<button class="choice" onclick="restart()">重新开始一段人生 <span>随机生成全新起点</span></button>`}
 else if(!S.currentEvent){document.getElementById("story").innerHTML=`<div class="day">TOKYO · LIFE ${S.turn}</div><h3>${greetingTitle()}</h3><p>${greetingText()}</p>`;document.getElementById("choices").innerHTML=`<button class="choice" onclick="triggerEvent(true)"><b>看看今天会发生什么</b><span>触发一个随机人生事件，做出选择并改变未来。</span></button>`}
 else {let e=S.currentEvent;document.getElementById("story").innerHTML=`<div class="day">随机事件 · ${S.age}岁 ${S.month}月</div><h3>${e.title}</h3><p>${e.text}</p>`;document.getElementById("choices").innerHTML=e.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${["A","B","C"][i]} · ${c[0]}</b><span>选择会影响你的属性与人际关系</span></button>`).join("")}
 renderActions();renderPeople();
 document.getElementById("logs").innerHTML=S.logs.map(x=>`<div class="log">• ${escapeHtml(x)}</div>`).join("");
}
function greetingTitle(){return rand(["新的机会正在靠近","今天也要为自己而活","城市里藏着新的故事","未来由一点点选择组成","也许今天会遇见重要的人"])}
function greetingText(){return rand([`东京的街道依旧忙碌。你整理了一下计划，决定今天把时间花在真正重要的事情上。`,`手机里有几条未读消息，日程也排得满满当当。你可以选择努力，也可以给自己一点喘息。`,`窗外的城市灯光渐渐亮起。你还不知道，某个不起眼的决定会在未来产生怎样的影响。`])}
function renderActions(){
 const acts=[["📚","认真学习","提升学识，消耗精力",()=>act("study")],["💼","打工兼职","赚取资金，积累经验",()=>act("work")],["🚀","推进创业计划","提升技能，也可能有风险",()=>act("startup")],["☕","社交与交友","拓展人脉，可能遇见角色",()=>act("social")],["🧡","休息充电","恢复精力与健康",()=>act("rest")],["🗺️","探索城市","触发特别事件与邂逅",()=>triggerEvent(true)]];
 document.getElementById("actions").innerHTML=acts.map((a,i)=>`<button class="action" ${S.ending||S.currentEvent?'disabled':''} onclick="actionByKey('${["study","work","startup","social","rest","explore"][i]}')"><div class="ico">${a[0]}</div><b>${a[1]}</b><small>${a[2]}</small></button>`).join("");
}
function renderPeople(){
 document.getElementById("people").innerHTML=characters.map(c=>{let v=S.relations[c.id]||0,known=S.met[c.id];return `<div class="person"><div class="person-top"><div class="miniavatar">${c.emoji}</div><div><h3>${c.name}</h3><small>${c.role}</small></div></div><div class="bar"><i style="width:${v}%"></i></div><div class="person-foot"><span>${known?"已相识":"尚未深入了解"}</span><b>${v} 好感</b></div><button onclick="interact('${c.id}')" ${S.ending||S.currentEvent?'disabled':''}>${known?"互动交流":"尝试结识"}</button></div>`}).join("");
}
function actionByKey(k){if(S.currentEvent||S.ending)return;act(k)}
function spend(n){if(S.energy<n){toast("精力不足，先休息一下吧。");return false}S.energy-=n;return true}
function advance(msg){S.turn++;S.month++;if(S.month>12){S.month=1;S.age++;log(`你迎来了${S.age}岁。新的年龄，也带来新的可能。`)}if(S.month===1){S.money-=300;log("支付生活开销：-300円（原型数值）。")}S.energy=clamp(S.energy,0,100);S.health=clamp(S.health);if(msg)log(msg);if(S.money<0){S.money=0;log("资金变得紧张，你需要重新规划生活。")}if(S.turn%3===0&&!S.ending){S.currentEvent=null;S.autoEventPending=true}save(false)}
function act(k){
 if(S.currentEvent||S.ending)return;
 let msg="";
 if(k==="study"){if(!spend(18))return;S.study=clamp(S.study+rand([5,7,9]));S.skill=clamp(S.skill+rand([0,2,3]));msg="你专心学习了一段时间，学识有所提升。"}
 if(k==="work"){if(!spend(25))return;let earn=rand([650,850,1100]) + Math.floor(S.skill*2);S.money+=earn;S.skill=clamp(S.skill+2);msg=`你完成了一次兼职，获得${earn}円，也积累了一点经验。`}
 if(k==="startup"){if(!spend(28))return;let roll=Math.random()+(S.skill+S.study)/250;if(roll>.82){let gain=rand([1200,1800,2500]);S.money+=gain;S.skill=clamp(S.skill+6);msg=`你的尝试获得了不错的反馈，收入增加${gain}円，技能提升。`}else{let loss=rand([300,500,800]);S.money=Math.max(0,S.money-loss);S.skill=clamp(S.skill+3);msg=`项目遇到阻碍，损失${loss}円，但你学到了宝贵的经验。`}let c=characters.find(x=>x.id==="ren");S.relations.ren=clamp(S.relations.ren+rand([1,3,5]));S.met.ren=true;}
 if(k==="social"){if(!spend(15))return;S.social=clamp(S.social+rand([3,5,7]));let c=rand(characters);S.met[c.id]=true;S.relations[c.id]=clamp(S.relations[c.id]+rand([2,4,6]));msg=`你参加了社交活动，结识/加深了与${c.name}的关系。社交能力提升。`}
 if(k==="rest"){S.energy=clamp(S.energy+35);S.health=clamp(S.health+5);msg="你放慢脚步，好好休息。精力与健康都恢复了一些。"}
 if(k==="explore"){if(!spend(12))return;triggerEvent(true);return}
 advance(msg);render();if(S.autoEventPending){S.autoEventPending=false;setTimeout(()=>triggerEvent(true),120)}
}
function triggerEvent(force){
 if(S.ending)return;
 if(S.currentEvent)return;
 let candidates=eventPool.filter((e,i)=>!S.usedEvents.includes(i));
 if(!candidates.length){S.usedEvents=[];candidates=eventPool.slice()}
 let e=rand(candidates);let idx=eventPool.indexOf(e);S.usedEvents.push(idx);S.eventCount++;S.currentEvent=JSON.parse(JSON.stringify(e));render();
}
function choose(i){
 const e=S.currentEvent;if(!e)return;const c=e.choices[i];let msg=`事件「${e.title}」：${c[0]}。`;
 if(c[1]==="money"){S.money=Math.max(0,S.money+c[2]);msg+=c[2]<0?`资金减少${Math.abs(c[2])}円。`:`获得${c[2]}円。`}
 else {S[c[1]]=clamp(S[c[1]]+c[2]);msg+=`${({study:"学识",skill:"技能",social:"社交",energy:"精力"}[c[1]]||c[1])}发生变化。`}
 if(c[3]){S.relations[c[3]]=clamp((S.relations[c[3]]||0)+c[4]);S.met[c[3]]=true;const who=characters.find(x=>x.id===c[3]);msg+=`与${who.name}的关系更加亲近。`}
 S.currentEvent=null;advance(msg);render();maybeEnding();
}
function interact(id){
 if(S.currentEvent||S.ending)return;
 const c=characters.find(x=>x.id===id);S.met[id]=true;
 if(!spend(10)){S.energy=clamp(S.energy+3);return}
 let bonus=rand([3,5,7,9]);if((id==="senpai"&&S.skill>35)||(id==="haru"&&S.social>35)||(id==="ren"&&S.skill>30)||(id==="mio"&&S.study>35))bonus+=3;
 S.relations[id]=clamp(S.relations[id]+bonus);S.social=clamp(S.social+1);
 let line=rand(c.lines);log(`你与${c.name}聊了一会儿。${line}（好感度 +${bonus}）`);advance("");render();toast(`与${c.name}的关系更近了一步`);
}
function maybeEnding(){
 if(S.age>=28||S.turn>=30){showEnding();return}
 const max=Math.max(...Object.values(S.relations));
 if(S.turn>=18&&max>=90){let c=characters.find(x=>S.relations[x.id]===max);S.ending=`${c.name} · ${c.route}结局`;log(`你与${c.name}的关系抵达新的阶段，解锁了专属结局。`);render();showEndModal(S.ending)}
}
function showEnding(){
 let max=Math.max(...Object.values(S.relations));let c=characters.find(x=>S.relations[x.id]===max);
 let end;if(S.skill>=75&&S.money>=7000)end="事业有成 · 独立创业结局";else if(S.study>=70)end="持续成长 · 学业与自我结局";else if(max>=60)end=`${c.name} · 特别羁绊结局`;else end="新的开始 · 平凡而自由的结局";
 S.ending=end;log(`人生阶段结束：${end}。`);render();showEndModal(end);
}
function showEndModal(end){
 const rel=characters.map(c=>`${c.name}：${S.relations[c.id]}好感`).join("、");
 document.getElementById("modalbox").innerHTML=`<div style="font-size:30px">🌸</div><h2>${escapeHtml(end)}</h2><p>${escapeHtml(S.name)}，你走过了${S.turn}个回合，经历了${S.age}岁的人生阶段。每一次选择都构成了独一无二的故事。</p><p><b>人生数据</b><br>学识 ${S.study} · 技能 ${S.skill} · 社交 ${S.social} · 资金 ${S.money}円</p><p><b>重要关系</b><br>${escapeHtml(rel)}</p><button class="primary" onclick="closeModal();restart()">开启下一段人生 →</button> <button class="secondary" onclick="closeModal()">继续回顾</button>`;
 document.getElementById("modal").classList.remove("hidden");
}
function restart(){document.getElementById("modal").classList.add("hidden");newGame(document.getElementById("nameInput").value.trim())}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function save(show=true){if(!S)return;try{localStorage.setItem("tokyoLifeSaveV1",JSON.stringify(S));if(show)toast("进度已保存在当前浏览器。")}catch(e){if(show)toast("当前环境无法保存进度。")}}
function load(){try{const d=localStorage.getItem("tokyoLifeSaveV1");if(!d){toast("还没有找到存档。");return}S=JSON.parse(d);document.getElementById("welcome").classList.add("hidden");document.getElementById("game").classList.remove("hidden");render();toast("存档已读取。")}catch(e){toast("存档读取失败。")}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.remove("hidden");clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.add("hidden"),2200)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("startBtn").onclick=()=>newGame(document.getElementById("nameInput").value.trim());
document.getElementById("continueBtn").onclick=load;
document.getElementById("saveBtn").onclick=()=>save(true);
document.getElementById("newLifeBtn").onclick=()=>{if(confirm("开启新人生会覆盖当前存档，确定继续吗？"))restart()};
document.getElementById("endBtn").onclick=()=>showEnding();
</script>
</body></html>
